name: Fetch US ADR data

on:
  schedule:
    # 22:00 UTC weekdays = 06:00 Taipei winter / 05:00 Taipei summer
    # Runs ~1h after US close (16:00 ET)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Fetch US ADR + FX
        run: python scripts/fetch_us.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "data: update ADR $(date -u +%Y-%m-%d)"
            git push
          fi
