name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Run 15 min after each data-fetch cron so Pages picks up the latest data.
    # GITHUB_TOKEN-driven push from a workflow does NOT trigger downstream workflows,
    # so deploy must trigger on its own schedule rather than on the data commits.
    - cron: '15 6 * * 1-5'   # ~15 min after TW close fetch
    - cron: '15 22 * * 1-5'  # ~15 min after US ADR fetch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Copy data folder into dist
        run: cp -r data dist/data
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
