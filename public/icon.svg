<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- 三條水平基準線（代表三價：便宜/合理/昂貴） -->
  <line x1="80" y1="180" x2="432" y2="180" stroke="white" stroke-width="6" opacity="0.25"/>
  <line x1="80" y1="280" x2="432" y2="280" stroke="white" stroke-width="6" opacity="0.4"/>
  <line x1="80" y1="380" x2="432" y2="380" stroke="white" stroke-width="6" opacity="0.25"/>
  <!-- 上升折線 -->
  <polyline points="80,400 170,310 250,340 340,200 432,140"
            fill="none" stroke="white" stroke-width="28"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 終點圓 -->
  <circle cx="432" cy="140" r="22" fill="#fef3c7"/>
</svg>
